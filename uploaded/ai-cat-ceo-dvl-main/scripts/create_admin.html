<!DOCTYPE html>
<html>
<head>
  <title>Admin Hesabı Yarat</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #4F46E5; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #4338CA; }
    .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #D1FAE5; color: #065F46; }
    .error { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
  <h1>🔐 Admin Hesabı Yarat</h1>
  <p>Firebase Authentication-da admin hesabı yaradılacaq.</p>
  
  <div class="form-group">
    <label>Email:</label>
    <input type="email" id="email" value="rasim@gmail.com">
  </div>
  
  <div class="form-group">
    <label>Şifrə:</label>
    <input type="password" id="password" value="Rasim2323">
  </div>
  
  <button onclick="createAdmin()">Hesab Yarat</button>
  
  <div id="message"></div>
  
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDgm0Zkdp8f-CHOAXDuAFnnoBMok1BCEIw",
      authDomain: "devaleur-11742.firebaseapp.com",
      projectId: "devaleur-11742"
    };
    
    firebase.initializeApp(firebaseConfig);
    
    async function createAdmin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      
      try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        messageDiv.innerHTML = '<div class="message success">✅ Hesab uğurla yaradıldı! Email: ' + userCredential.user.email + '</div>';
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          // Hesab artıq var, giriş etməyə çalışaq
          try {
            const signInResult = await firebase.auth().signInWithEmailAndPassword(email, password);
            messageDiv.innerHTML = '<div class="message success">✅ Hesab artıq mövcuddur və giriş uğurlu oldu! Email: ' + signInResult.user.email + '</div>';
          } catch (signInError) {
            messageDiv.innerHTML = '<div class="message error">❌ Hesab mövcuddur, amma şifrə yanlışdır.</div>';
          }
        } else {
          messageDiv.innerHTML = '<div class="message error">❌ Xəta: ' + error.message + '</div>';
        }
      }
    }
  </script>
</body>
</html>
